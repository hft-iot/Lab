# This is a Mosquitto configuration file that exposes two listeners:
# - 1883 stays open for comparison with the insecure baseline.
# - 8883 enforces mutual TLS with client certificates.

listener 1883
listener_allow_anonymous true

listener 8883
cafile /mosquitto/certs/lab-ca.crt
certfile /mosquitto/certs/mqtt-server.crt
keyfile /mosquitto/certs/mqtt-server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
listener_allow_anonymous false